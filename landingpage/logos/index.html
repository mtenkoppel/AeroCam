<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>AeroCam logo concepts — iteration on #1</title>
<style>
  body { margin:0; background:#101214; font-family: ui-monospace, Menlo, monospace; color:#b8c1cc; padding:32px; }
  h1 { color:#fff; font-size:1rem; letter-spacing:0.1em; }
  .row { display:grid; grid-template-columns: repeat(3, 1fr); gap:24px; max-width:1100px; }
  .cell { display:flex; flex-direction:column; gap:12px; }
  .card { border-radius:16px; padding:16px; display:flex; align-items:center; justify-content:center; }
  .card.light { background:#f4f6f8; }
  .card.dark { background:#000; border:1px solid #23282c; }
  .card img.big { width:100%; max-width:280px; }
  .strip { display:flex; align-items:center; gap:16px; background:#f4f6f8; border-radius:12px; padding:10px 16px; }
  .strip img { display:block; }
  .dark img { filter: invert(1); }
  .label { font-size:0.75rem; letter-spacing:0.08em; }
</style>
</head>
<body>
<h1>AEROCAM — LOGO #1 ITERATIONS</h1>
<div class="row">
  <div class="cell">
    <span class="label">1A — BLADES (upright, tapered)</span>
    <div class="card light"><img class="big" src="aerocam-logo-1a.svg"/></div>
    <div class="card dark"><img class="big" src="aerocam-logo-1a.svg"/></div>
    <div class="strip"><img src="aerocam-logo-1a.svg" width="64"/><img src="aerocam-logo-1a.svg" width="32"/><img src="aerocam-logo-1a.svg" width="20"/></div>
  </div>
  <div class="cell">
    <span class="label">2B — DASH RHYTHM (italic)</span>
    <div class="card light"><img class="big" src="aerocam-logo-1b.svg"/></div>
    <div class="card dark"><img class="big" src="aerocam-logo-1b.svg"/></div>
    <div class="strip"><img src="aerocam-logo-1b.svg" width="64"/><img src="aerocam-logo-1b.svg" width="32"/><img src="aerocam-logo-1b.svg" width="20"/></div>
  </div>
  <div class="cell">
    <span class="label">1C — LINE PACK (italic, fine)</span>
    <div class="card light"><img class="big" src="aerocam-logo-1c.svg"/></div>
    <div class="card dark"><img class="big" src="aerocam-logo-1c.svg"/></div>
    <div class="strip"><img src="aerocam-logo-1c.svg" width="64"/><img src="aerocam-logo-1c.svg" width="32"/><img src="aerocam-logo-1c.svg" width="20"/></div>
  </div>
  <div class="cell">
    <span class="label">1D — PASS-THROUGH (upright)</span>
    <div class="card light"><img class="big" src="aerocam-logo-1d.svg"/></div>
    <div class="card dark"><img class="big" src="aerocam-logo-1d.svg"/></div>
    <div class="strip"><img src="aerocam-logo-1d.svg" width="64"/><img src="aerocam-logo-1d.svg" width="32"/><img src="aerocam-logo-1d.svg" width="20"/></div>
  </div>
  <div class="cell">
    <span class="label">1E — PASS-THROUGH (italic)</span>
    <div class="card light"><img class="big" src="aerocam-logo-1e.svg"/></div>
    <div class="card dark"><img class="big" src="aerocam-logo-1e.svg"/></div>
    <div class="strip"><img src="aerocam-logo-1e.svg" width="64"/><img src="aerocam-logo-1e.svg" width="32"/><img src="aerocam-logo-1e.svg" width="20"/></div>
  </div>
</div>
</body>
</html>
