<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- AeroCam concept 1B: "Dash rhythm" — italic cam leaning into the wind,
       speed lines broken into segments; each row's leading edge follows the lean. -->
  <g transform="translate(34 0) skewX(-8)">
    <rect x="190" y="150" width="256" height="220" rx="52" fill="none" stroke="currentColor" stroke-width="32"/>
    <circle cx="350" cy="240" r="56" fill="none" stroke="currentColor" stroke-width="30"/>
    <circle cx="350" cy="240" r="16" fill="currentColor"/>
  </g>
  <g fill="currentColor">
    <rect x="110" y="179" width="48" height="22" rx="11"/>
    <rect x="72"  y="179" width="24" height="22" rx="11"/>
    <rect x="40"  y="179" width="14" height="22" rx="7"/>
    <rect x="88"  y="249" width="60" height="22" rx="11"/>
    <rect x="40"  y="249" width="32" height="22" rx="11"/>
    <rect x="12"  y="249" width="14" height="22" rx="7"/>
    <rect x="94"  y="319" width="44" height="22" rx="11"/>
    <rect x="56"  y="319" width="24" height="22" rx="11"/>
    <rect x="28"  y="319" width="14" height="22" rx="7"/>
  </g>
</svg>
