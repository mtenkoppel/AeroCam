    <circle cx="236" cy="212" r="17"/>
    <rect x="284" y="318" width="92" height="26" rx="13"/>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="34">
    <rect x="176" y="152" width="264" height="224" rx="52"/>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="30">
    <circle cx="344" cy="244" r="54"/>
