<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- AeroCam logo concept 2: "Flow-through" — solid cam body with wind channels cut
       clean through it; external lines continue the same flow, like the helmet vents. -->
  <defs>
    <mask id="flow-cuts">
      <rect width="512" height="512" fill="white"/>
      <rect x="112" y="176" width="158" height="30" rx="15" fill="black"/>
      <rect x="112" y="242" width="118" height="30" rx="15" fill="black"/>
      <rect x="112" y="308" width="178" height="30" rx="15" fill="black"/>
      <circle cx="326" cy="222" r="66" fill="black"/>
      <rect x="296" y="330" width="84" height="24" rx="12" fill="black"/>
    </mask>
  </defs>
  <g fill="currentColor">
    <rect x="136" y="128" width="280" height="256" rx="60" mask="url(#flow-cuts)"/>
    <circle cx="326" cy="222" r="42"/>
    <rect x="28" y="178" width="64" height="26" rx="13"/>
    <rect x="8" y="244" width="84" height="26" rx="13"/>
    <rect x="44" y="310" width="48" height="26" rx="13"/>
  </g>
</svg>
