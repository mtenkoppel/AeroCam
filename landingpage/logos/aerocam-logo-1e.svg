<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- AeroCam concept 1E: "Pass-through italic" — the 1D entry lines combined with
       the 8° forward lean; the body outline opens where the wind flows in. -->
  <defs>
    <mask id="entry-gaps-i">
      <rect width="512" height="512" fill="white"/>
      <rect x="130" y="166" width="110" height="48" fill="black"/>
      <rect x="130" y="236" width="110" height="48" fill="black"/>
    </mask>
  </defs>
  <g transform="translate(34 0) skewX(-8)" mask="url(#entry-gaps-i)">
    <rect x="190" y="150" width="256" height="220" rx="52" fill="none" stroke="currentColor" stroke-width="32"/>
  </g>
  <g transform="translate(34 0) skewX(-8)">
    <circle cx="350" cy="240" r="56" fill="none" stroke="currentColor" stroke-width="30"/>
    <circle cx="350" cy="240" r="16" fill="currentColor"/>
  </g>
  <g fill="currentColor">
    <rect x="74" y="178" width="204" height="24" rx="12"/>
    <rect x="36" y="248" width="230" height="24" rx="12"/>
    <rect x="86" y="318" width="56" height="24" rx="12"/>
  </g>
</svg>
