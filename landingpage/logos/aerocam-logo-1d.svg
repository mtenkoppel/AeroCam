<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- AeroCam concept 1D: "Pass-through" — speed lines enter the cam body through
       breaks in the outline (stopwatch-style), ending inside before the lens. -->
  <defs>
    <mask id="entry-gaps">
      <rect width="512" height="512" fill="white"/>
      <rect x="150" y="166" width="84" height="48" fill="black"/>
      <rect x="150" y="236" width="84" height="48" fill="black"/>
    </mask>
  </defs>
  <rect x="190" y="150" width="256" height="220" rx="52" fill="none" stroke="currentColor" stroke-width="32" mask="url(#entry-gaps)"/>
  <circle cx="350" cy="240" r="56" fill="none" stroke="currentColor" stroke-width="30"/>
  <circle cx="350" cy="240" r="16" fill="currentColor"/>
  <g fill="currentColor">
    <rect x="64" y="178" width="208" height="24" rx="12"/>
    <rect x="32" y="248" width="224" height="24" rx="12"/>
    <rect x="88" y="318" width="66" height="24" rx="12"/>
  </g>
</svg>
