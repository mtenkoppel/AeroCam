gradle.projectsEvaluated {
    def app = gradle.rootProject.project(':app')
    app.tasks.register('trialRuntimeReport') {
        doLast {
            def output = new File(gradle.rootProject.buildDir, 'trial/runtime.tsv')
            output.parentFile.mkdirs()
            def rows = app.configurations.releaseRuntimeClasspath.resolvedConfiguration.resolvedArtifacts.collect { artifact ->
                def digest = java.security.MessageDigest.getInstance('SHA-256')
                artifact.file.withInputStream { stream ->
                    byte[] buffer = new byte[8192]
                    int count
                    while ((count = stream.read(buffer)) > 0) digest.update(buffer, 0, count)
                }
                "${artifact.moduleVersion.id}\t${artifact.classifier ?: ''}\t${digest.digest().encodeHex()}"
            }.sort()
            output.text = rows.join('\n') + '\n'
        }
    }
}
