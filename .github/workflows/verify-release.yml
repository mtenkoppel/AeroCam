name: Signed test build
on:
  workflow_dispatch:
    inputs:
      release_signed_debug:
        description: Build an in-place debuggable test APK with the established key
        type: boolean
        required: false
        default: false
permissions:
  contents: read
  packages: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # Keep caching on the MIT-licensed provider.
          cache-provider: basic
          dependency-graph: disabled
          build-scan-publish: false
      - name: Restore signing key
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE"
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/aerocam-release.jks"
      - name: Build signed APK
        env:
          ORG_GRADLE_PROJECT_releaseSignedDebug: ${{ inputs.release_signed_debug }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AEROCAM_KEYSTORE_PATH: ${{ runner.temp }}/aerocam-release.jks
          AEROCAM_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          AEROCAM_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          AEROCAM_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          BUILD_DEBUG: ${{ inputs.release_signed_debug }}
        run: |
          test -n "$AEROCAM_KEYSTORE_PASSWORD"
          test -n "$AEROCAM_KEY_ALIAS"
          test -n "$AEROCAM_KEY_PASSWORD"
          task=assembleRelease
          if [ "$BUILD_DEBUG" = true ]; then task=assembleDebug; fi
          ./gradlew "$task"
      - name: Verify APK and prepare artifact
        id: apk
        env:
          BUILD_DEBUG: ${{ inputs.release_signed_debug }}
        run: |
          variant=release
          artifact="aerocam-signed-$GITHUB_SHA"
          if [ "$BUILD_DEBUG" = true ]; then
            variant=debug
            artifact="aerocam-design-qa-debug-$GITHUB_SHA"
          fi
          apk="app/build/outputs/apk/$variant/app-$variant.apk"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          signing_report=$("$tools/apksigner" verify --print-certs "$apk")
          certificate=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' <<< "$signing_report")
          test "$certificate" = "cf5c62d207d7a6e7b03b056604c30873180390d11129f791231e19844ceab0ce"
          "$tools/aapt" dump badging "$apk" > "$apk.badging.txt"
          grep -q "^package: name='com.karoopoc'" "$apk.badging.txt"
          if [ "$BUILD_DEBUG" = true ]; then
            grep -q '^application-debuggable' "$apk.badging.txt"
          elif grep -q '^application-debuggable' "$apk.badging.txt"; then
            echo "Expected a non-debuggable APK"
            exit 1
          fi
          (cd "$(dirname "$apk")" && sha256sum "$(basename "$apk")") > "$apk.sha256"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.apk.outputs.artifact }}
          path: |
            ${{ steps.apk.outputs.apk }}
            ${{ steps.apk.outputs.apk }}.sha256
            ${{ steps.apk.outputs.apk }}.badging.txt
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/aerocam-release.jks"
