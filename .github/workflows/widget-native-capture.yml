name: Native widget verification build
on:
  workflow_dispatch:
  push:
    branches: ['codex/combined-photo-video']
    paths: ['app/**', '.github/workflows/widget-native-capture.yml']
permissions:
  contents: read
  packages: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build isolated rendering test app
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew -PwidgetCapture=true assembleDebug assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: widget-native-verification
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
          retention-days: 2
          if-no-files-found: error
