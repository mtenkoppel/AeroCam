name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # Keep caching on the MIT-licensed provider.
          cache-provider: basic
          dependency-graph: disabled
          build-scan-publish: false
      - name: Restore signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          umask 077
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aerocam-release.jks"
      - name: Test and build signed APK
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AEROCAM_KEYSTORE_PATH: ${{ runner.temp }}/aerocam-release.jks
          AEROCAM_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          AEROCAM_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          AEROCAM_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease
      - name: Verify release signing identity
        run: |
          certificate=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test "$certificate" = "cf5c62d207d7a6e7b03b056604c30873180390d11129f791231e19844ceab0ce"
      - name: Prepare release assets
        run: |
          cp app/build/outputs/apk/release/app-release.apk "AeroCam-${GITHUB_REF_NAME}.apk"
          sha256sum "AeroCam-${GITHUB_REF_NAME}.apk" > "AeroCam-${GITHUB_REF_NAME}.apk.sha256"
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE_FLAG: ${{ contains(github.ref_name, '-') && '--prerelease' || '' }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "AeroCam-${GITHUB_REF_NAME}.apk"
          "AeroCam-${GITHUB_REF_NAME}.apk.sha256"
          --verify-tag
          --draft
          --generate-notes
          $PRERELEASE_FLAG
          --title "AeroCam ${GITHUB_REF_NAME}"
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/aerocam-release.jks"
