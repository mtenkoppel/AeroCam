name: Publish release

on:
  workflow_dispatch:
    inputs:
      approved_commit:
        description: Full SHA of the approved master commit
        required: true
        type: string

concurrency:
  group: publish-release
  cancel-in-progress: false

permissions:
  contents: write
  packages: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check approved source
        env:
          APPROVED_COMMIT: ${{ inputs.approved_commit }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/master ] || [ "$GITHUB_SHA" != "$APPROVED_COMMIT" ]; then
            echo "Select master and enter the full SHA of its approved commit."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # Keep caching on the MIT-licensed provider.
          cache-provider: basic
          dependency-graph: disabled
          build-scan-publish: false
      - name: Restore signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          umask 077
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aerocam-release.jks"
      - name: Test and build signed APK
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AEROCAM_KEYSTORE_PATH: ${{ runner.temp }}/aerocam-release.jks
          AEROCAM_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          AEROCAM_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          AEROCAM_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease
      - name: Verify APK and prepare release assets
        id: release
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          tools="$ANDROID_HOME/build-tools/35.0.0"
          signing_report=$("$tools/apksigner" verify --print-certs "$apk")
          certificate=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' <<< "$signing_report")
          test "$certificate" = "cf5c62d207d7a6e7b03b056604c30873180390d11129f791231e19844ceab0ce"
          badging=$("$tools/aapt" dump badging "$apk")
          grep -q "^package: name='com.karoopoc'" <<< "$badging"
          if grep -q '^application-debuggable' <<< "$badging"; then
            echo "Public APK must have debugging disabled."
            exit 1
          fi
          version=$(sed -n "s/^package: .*versionName='\([^']*\)'.*/\1/p" <<< "$badging")
          if ! [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-beta\.([1-9][0-9]*))?$ ]]; then
            echo "Expected MAJOR.MINOR.PATCH or MAJOR.MINOR.PATCH-beta.N in the APK."
            exit 1
          fi
          awk -v version="$version" '
            $0 == "## [" version "]" || index($0, "## [" version "] - ") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          grep -q '[^[:space:]]' release-notes.md
          tag="v$version"
          cp "$apk" "AeroCam-$tag.apk"
          sha256sum "AeroCam-$tag.apk" > "AeroCam-$tag.apk.sha256"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-beta.* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish approved release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          existing_tag=$(git ls-remote --tags origin "refs/tags/$TAG")
          if [ -n "$existing_tag" ]; then
            echo "Tag $TAG already exists. Use a new version."
            exit 1
          fi
          release_flags=(--latest)
          if [ "$PRERELEASE" = true ]; then release_flags=(--prerelease --latest=false); fi
          gh release create "$TAG" "AeroCam-$TAG.apk" "AeroCam-$TAG.apk.sha256" \
            --target "$GITHUB_SHA" --title "AeroCam $TAG" --notes-file release-notes.md "${release_flags[@]}"
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/aerocam-release.jks"
