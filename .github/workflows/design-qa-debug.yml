name: Design QA debug test build
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # Keep caching on the MIT-licensed provider.
          cache-provider: basic
          dependency-graph: disabled
          build-scan-publish: false
      - name: Restore signing key
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE"
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/aerocam-release.jks"
      - name: Test and build signed debug APK
        env:
          ORG_GRADLE_PROJECT_releaseSignedDebug: 'true'
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AEROCAM_KEYSTORE_PATH: ${{ runner.temp }}/aerocam-release.jks
          AEROCAM_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          AEROCAM_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          AEROCAM_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$AEROCAM_KEYSTORE_PASSWORD"
          test -n "$AEROCAM_KEY_ALIAS"
          test -n "$AEROCAM_KEY_PASSWORD"
          ./gradlew -I .github/trial/runtime-report.gradle testDebugUnitTest assembleDebug :app:trialRuntimeReport
      - name: Verify signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk
          certificate=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test "$certificate" = "cf5c62d207d7a6e7b03b056604c30873180390d11129f791231e19844ceab0ce"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/app-debug.badging.txt
          grep -q '^application-debuggable' app/build/outputs/apk/debug/app-debug.badging.txt
          sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/app-debug.apk.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aerocam-design-qa-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
            app/build/outputs/apk/debug/app-debug.badging.txt
          if-no-files-found: error
          retention-days: 14
      - name: Save build validation evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: aerocam-build-evidence-${{ github.sha }}
          path: |
            build/trial/runtime.tsv
            app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/aerocam-release.jks"
